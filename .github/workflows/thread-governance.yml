#name: Thread Governance
#
## 线程滥用卡口。
##
## 为什么要单独一个窄闸门，而不是跑完整 lint：
## 本仓库存在与线程无关的既有 lint 债务（OnClick 回调缺失等 27 处）。
## 若闸门是「完整 lint 必须绿」，它上线第一天就是红的，然后被加 continue-on-error
## 或直接删掉 —— 这是绝大多数 lint 卡口的死法。
## 所以这里只跑线程三条规则（-PthreadLintOnly），它能**立刻**变绿并长期保持。
