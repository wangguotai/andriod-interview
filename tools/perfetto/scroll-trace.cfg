# Perfetto 抓取配置：Android 滑动流畅度（scroll jank）
#
# 由 tools/perfetto/record-scroll.sh 使用；其中的 __APP__ 会被替换成应用包名。
# 也可以手动用： adb shell perfetto -c <本文件> --txt -o /data/misc/perfetto-traces/trace
#
# 抓到的三类数据：
#   1) linux.ftrace         —— CPU 调度 + atrace 的 view/gfx/input/wm（含 RecyclerView 自带埋点）
#   2) linux.process_stats  —— 进程名映射，analyze_trace.py 靠它定位 app 主线程
#   3) frametimeline        —— 预期帧 vs 实际帧，Perfetto 直接给出 jank 归因

buffers: {
    size_kb: 65536
    fill_policy: RING_BUFFER
}

data_sources: {
    config {
        name: "linux.ftrace"
        target_buffer: 0
        ftrace_config {
            # atrace 分类：
            #   view  = Choreographer#doFrame / ViewRootImpl.traversal / RV OnBindView 等
            #   gfx   = 绘制与 HWUI
            #   input = 触摸事件分发（滑动延迟常在这里）
            #   wm    = WindowManager
            atrace_categories: "view"
            atrace_categories: "gfx"
            atrace_categories: "input"
            atrace_categories: "wm"

            # 只跟踪我们的进程，避免满屏噪音；__APP__ 由脚本替换
            atrace_apps: "__APP__"

            # CPU 调度 / 频率：判断 UI 线程有没有被抢占、大核有没有起来
            ftrace_events: "sched/sched_switch"
            ftrace_events: "sched/sched_waking"
            ftrace_events: "power/cpu_frequency"
            ftrace_events: "power/cpu_idle"

            # 跨进程事务：看 Surface 提交、主线程被谁阻塞
            ftrace_events: "binder/binder_transaction"
            ftrace_events: "binder/binder_transaction_received"
        }
    }
}

data_sources: {
    config {
        name: "linux.process_stats"
        target_buffer: 0
        process_stats_config {
            # 启动时扫描一次全部进程，把 pid 映射到进程名。
            # 没有它，trace 里 process.name 全是 NULL，无法定位 app 主线程。
            scan_all_processes_on_start: true
        }
    }
}

data_sources: {
    config {
        # FrameTimeline：直接产出 expected_frame / actual_frame，以及 jank_type
        name: "android.surfaceflinger.frametimeline"
    }
}

# 抓 10 秒；期间请手动滑动列表（record-scroll.sh 也支持 --auto-swipe）
duration_ms: 10000
