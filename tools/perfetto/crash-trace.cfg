# Perfetto 抓取配置：崩溃（Crash）现场取证
#
# 用途：在"即将崩溃"的窗口内抓 trace，拿到崩溃前后的：
#   1) 主线程/崩溃线程在死之前**最后在干什么**（slice + 状态）
#   2) 崩溃前是否有 GC / Running 爆表 / IO / 锁等待
#   3) 内核阻塞原因（sched_blocked_reason，本机实测可用）
#   4) 全进程 CPU 视图，看是不是被抢占 / 降频
#
# ⚠️ 重要限制（实测）：Perfetto 抓不到"崩溃本身"这个事件。
#    它没有 tombstone / Java 异常 / signal 的数据源。所以本文档的用法是：
#    **trace 用来看"死之前发生了什么"，tombstone/ANR全文/logcat 用来看"怎么死的"**。
#    两者靠**时间对齐**拼起来（这也是本仓 ANR 文档的同一套方法论）。
#
# 用法（脚本会自动替换 __APP__ 与时长）：
#   adb shell perfetto -c <本文件> --txt -o /data/misc/perfetto-traces/crash
#
# 注意：配置必须放在 /data/misc/perfetto-configs（SELinux 限制，实测），
#      不能放 /data/local/tmp。

buffers: {
    size_kb: 131072
    fill_policy: RING_BUFFER
}

data_sources: {
    config {
        name: "linux.ftrace"
        target_buffer: 0
        ftrace_config {
            # atrace：view/gfx/input/wm —— 崩溃前的 UI 行为
            # ⭐ dalvik 是关键：它带来 GC 切片（"Background concurrent copying GC"）
            #    与 "Heap size (KB)" 计数器 —— OOM 排查离不了（实测：不加 dalvik
            #    时这两样都没有，见本文档头部的数据源对照）。
            atrace_categories: "view"
            atrace_categories: "gfx"
            atrace_categories: "input"
            atrace_categories: "wm"
            atrace_categories: "am"
            atrace_categories: "dalvik"
            atrace_apps: "__APP__"

            # CPU 调度：谁抢了 CPU / 崩溃线程有没有被唤醒
            ftrace_events: "sched/sched_switch"
            ftrace_events: "sched/sched_waking"
            # ⭐ 本机实测可用：内核级阻塞原因（futex/binder/io）
            #    没有它，只能猜"在等"；有了它，能知道"在等什么"
            ftrace_events: "sched/sched_blocked_reason"
            ftrace_events: "power/cpu_frequency"
            ftrace_events: "power/cpu_idle"

            # 进程命名（不加 process.name 会是 NULL 或 zygote64，实测踩过）
            ftrace_events: "task/task_rename"
            ftrace_events: "task/task_newtask"

            # 跨进程：崩溃前的 binder 交互
            ftrace_events: "binder/binder_transaction"
            ftrace_events: "binder/binder_transaction_received"
        }
    }
}

data_sources: {
    config {
        name: "linux.process_stats"
        target_buffer: 0
        process_stats_config {
            scan_all_processes_on_start: true
            proc_stats_poll_ms: 1000
        }
    }
}

data_sources: {
    config {
        # ⚠️ 实测：这个源在本机（Redmi K40 / Android 12 / user build）**收不到任何日志**
        #    —— trace 里 stats 的 android_log_num_total=0，android_logs 表为空。
        #    原因：logd 读取需要 READ_LOGS（特权/签名级），普通 App 与 perfetto 都拿不到。
        #    所以 logcat **必须单独用 adb logcat 抓**（record-crash.sh 已经这么做了，
        #    产物落在 <trace>.logcat.txt）。这里保留注释仅作记录，不再订阅。
        # name: "android.log"
        # android_log_config { log_ids: LID_DEFAULT }
        name: "android.surfaceflinger.frametimeline"
    }
}

# ⚠️ duration_ms 由 record-crash.sh 统一追加（模板里不能出现，否则重复字段被 protobuf 拒绝）
