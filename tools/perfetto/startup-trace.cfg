# Perfetto 抓取配置：冷启动（含类加载 / 静态块排查）
#
# 由 tools/perfetto/record-startup.sh 使用；__APP__ 会被替换成应用包名。
#
# ⚠️ 关键事实（实测得出，别再被误导）：
#   atrace 的 `dalvik` 分类在这台 Android 12 上**只产出 ART native 侧切片**
#   （IndirectReferenceTable::Trim / TrimSpaces / monitor contention …），
#   **不产出 Java 的 <clinit> / InitializeClass 切片**。
#   所以"找静态代码块耗时"这件事，Perfetto 一条腿走不通 —— 必须配
#   `am start --start-profiler` 的 ART 方法级 trace（见 record-startup.sh）。
#   本配置负责的是**相位**（进程创建 / bindApplication / activityStart / 首帧），
#   ART trace 负责**方法**（含每个 <clinit> 的真实墙钟）。

buffers: {
    size_kb: 65536
    fill_policy: RING_BUFFER
}

data_sources: {
    config {
        name: "linux.ftrace"
        target_buffer: 0
        ftrace_config {
            # dalvik = ART 运行时（verify / GC / 锁）；view/gfx = 首帧遍历
            # am/wm = Activity 启动事务；res = 资源加载
            atrace_categories: "dalvik"
            atrace_categories: "view"
            atrace_categories: "gfx"
            atrace_categories: "am"
            atrace_categories: "wm"
            atrace_categories: "res"
            atrace_categories: "input"

            # 只跟踪我们的进程；__APP__ 由脚本替换
            atrace_apps: "__APP__"

            ftrace_events: "sched/sched_switch"
            ftrace_events: "sched/sched_waking"
            # ⚠️ 关键：没有它，thread_state.blocked_function 全是 NULL，
            #    只能看出"卡了多久"、看不出"卡在哪"。有了它，被阻塞时内核会
            #    记下 caller（如 futex_wait_queue_me / do_epoll_wait / binder 等），
            #    analyze_startup.py 的 [C] 段才能给出"阻塞点"归因。
            #    实测设备 Android 12 / MIUI 存在 /sys/kernel/tracing/events/sched/sched_blocked_reason。
            ftrace_events: "sched/sched_blocked_reason"

            # 进程改名：app 由 zygote fork 后先叫 zygote64，直到 setProcessName
            # 触发 task_rename 才是真实包名。不订阅它，Perfetto UI 里轨道会挂错。
            ftrace_events: "task/task_rename"
            ftrace_events: "task/task_newtask"

            # 类加载/校验会读 dex、拿 mmap，看缺页
            ftrace_events: "kmem/mm_page_alloc"

            # ⚠️⚠️ 不要订阅 binder/binder_transaction（单独订阅）！实测本机
            #   （Redmi K40 / Android 12 / perfetto v15）只给 binder_transaction
            #   而不给它的配对方 binder_transaction_received，会产生 ~8500 个
            #   **未闭合的 binder transaction slice**，进而打乱所在线程的 slice
            #   栈 —— 结果是 bindApplication / app.onCreate / activityStart /
            #   performCreate 这些 atrace 埋点的 dur 全变成 -1（闭合不了），
            #   启动相位直接报废。
            #   实测矩阵（每次都是全新冷启动抓取）：
            #     · 只 sched+task                     → unclosed 5   ✓ 相位完整
            #     · 再加 kmem+input+frametimeline      → unclosed 3   ✓ 相位完整
            #     · 再加 binder/binder_transaction     → unclosed 8513 ✗ 相位全 -1
            #   需要 binder 时，必须把 binder_transaction_received /
            #   binder_transaction_alloc_buf / binder_set_priority 一起订阅
            #   （系统自动开 binder 时就是这一组，所以那样配是好的）。
            #   本站排查启动耗时用不到 binder，故不订阅。
        }
    }
}

data_sources: {
    config {
        name: "linux.process_stats"
        target_buffer: 0
        process_stats_config {
            scan_all_processes_on_start: true
            # app 在本次抓取期间才拉起：不轮询会漏掉进程名映射
            proc_stats_poll_ms: 1000
        }
    }
}

data_sources: {
    config {
        name: "android.surfaceflinger.frametimeline"
    }
}

# 抓 12 秒：给"起 perfetto → 拉进程 → 首帧 → 稳定"留足窗口
duration_ms: 12000
