# Perfetto heapprofd config template: native heap allocation profiling.
#
# IMPORTANT: this file is pushed VERBATIM to the device (with __TARGET_LINE__
# replaced by record-heapprofd.sh). Two hard rules learned on a real device
# (Redmi K40 / Android 12 / MIUI):
#
#   1. ASCII ONLY. The device-side pbtxt parser (pbtxt_to_pb.cc) misparses
#      UTF-8 comments and then reports a MISLEADING error such as
#      "No field named target_cmdline" on a perfectly valid field.
#      Keep comments here in English; Chinese explanations live in
#      record-heapprofd.sh.
#
#   2. ONE FIELD PER LINE. Compact one-liners like `a: { b: 1 } }` make the
#      same parser fail with "Unexpected char }".
#
# Field notes:
#   target_cmdline  : profile by package name. Requires perfetto >= ~v18
#                     (Android 12L+). Android 12 does not have the field;
#                     record-heapprofd.sh then falls back to pid targeting.
#   pid             : attach mode. Works on user builds for DEBUGGABLE apps
#                     (verified: "heapprofd_client initialized" in logcat).
#   shmem_size_bytes: client shared-memory ring. The default is small; an
#                     allocation burst overruns it and data is SILENTLY
#                     DROPPED (stat heapprofd_buffer_overran). 16 MiB is
#                     enough for a lab workload incl. 32 x 1 MiB bursts.
#   block_client    : true = when the ring is full, BLOCK the allocating
#                     thread instead of dropping. Slower but lossless; the
#                     right choice when numbers are compared against
#                     memtrace (bytehook) as an oracle.
#   sampling_interval_bytes: heapprofd samples ~1 allocation per N bytes.
#                     Allocations LARGER than N are always sampled with
#                     exact size; smaller ones are extrapolated estimates.

buffers: {
  size_kb: 131072
  fill_policy: RING_BUFFER
}

data_sources: {
  config {
    name: "android.heapprofd"
    target_buffer: 0
    heapprofd_config {
      __TARGET_LINE__
      sampling_interval_bytes: 4096
      shmem_size_bytes: 16777216
      block_client: true
      continuous_dump_config {
        dump_interval_ms: 5000
      }
    }
  }
}

data_sources: {
  config {
    name: "linux.process_stats"
    target_buffer: 0
    process_stats_config {
      scan_all_processes_on_start: true
    }
  }
}
