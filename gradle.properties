org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and none from the library's dependencies,
# thereby reducing the size of the R class for that library
android.nonTransitiveRClass=true
# ?? gradle debug ??
#org.gradle.debug = true

# Use this property to specify which architecture you want to build.
# You can also override it from the CLI using
# ./gradlew <task> -PreactNativeArchitectures=x86_64
reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64

# Use this property to enable support to the new architecture.
# This will allow you to use TurboModules and the Fabric render in
# your application. You should enable this flag either if you want
# to write custom TurboModules/Fabric components OR use libraries that
# are providing them.
newArchEnabled=true

# Use this property to enable or disable the Hermes JS engine.
# If set to false, you will be using JSC instead.
hermesEnabled=true

# ═══════════════════════════════════════════════════════════════════════
#  包体积优化开关（编译期）
# ═══════════════════════════════════════════════════════════════════════
#
#  全部默认 false —— 即"不改动现有构建行为"。
#  需要时用 -P 命令行覆盖，或在 CI 里对 release 全部置 true。
#
#  为什么默认全关：本仓库的定位是**教学/实验**，很多 Lab 依赖未裁剪的
#  dex 与资源来做对照演示；默认打开会改变既有产物，也会让 R8 的
#  keep 规则一旦漏配就以"运行时崩溃"的形式暴露。开关制让两件事解耦：
#  日常开发保持原样，出体积包时统一打开。
#
#  用法：
#    ./gradlew :app:assembleRelease -Popt.all                    # 一键全开
#    ./gradlew :app:assembleRelease -Popt.shrink                 # 只开 R8
#    ./gradlew :app:assembleRelease -Popt.shrink -Popt.audit     # R8 + 报告
#    ./gradlew :app:bundleRelease  -Popt.shrink                  # 出 AAB（交付层）
#
#  ── 各开关语义 ──
#
#  opt.shrink  R8 代码压缩 + 资源压缩（isMinifyEnabled + shrinkResources）
#              ⚠️ 依赖 proguard-rules.pro 的 keep 规则；漏配 = 运行时崩，
#              不会在编译期报错。首次打开务必跑真机回归。
#
#  opt.webp    构建前把 res/ 下的 png/jpg 转成 webp（需本机 cwebp），
#              并同步改写 XML/源码里的引用。幂等：已 webp 的会跳过。
#              会**修改工作区源文件**，故默认只报告不落盘；
#              真正落盘需再加 opt.webp.apply=true。
#
#  opt.audit   输出"无用资源 / 无用代码"报告到 app/build/reports/opt/：
#              R8 的 usage.txt + mapping.txt，以及 lint UnusedResources。
#              报告不等于自动删除，删除动作仍走 opt.shrink 的资源压缩。
#
#  opt.all     = shrink + audit（不含 webp：webp 会改源文件，须显式开）
# ═══════════════════════════════════════════════════════════════════════

# 若在 CI 上想整体打开，改这里即可（不要改上面的注释块）
opt.shrink=false
opt.webp=false
opt.webp.apply=false
opt.audit=false