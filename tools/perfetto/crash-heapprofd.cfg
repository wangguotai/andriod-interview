# Perfetto 配置：trace（ftrace） + heapprofd（native 堆分配）同时抓
#
# 目的：一次抓取同时拿到
#   ① linux.ftrace        —— CPU 调度 / atrace / binder / 崩溃前时间线
#   ② android.heapprofd   —— native 堆分配归因（谁分配了什么）
#   ③ linux.process_stats —— 进程名映射
#   ④ dalvik atrace       —— GC 切片 + 堆曲线
#
# ⚠️ 由 record-crash-heapprofd.sh 替换两个占位符：
#      __APP__  应用包名
#      __PID__  目标进程 pid（heapprofd 附加模式必须用 pid，
#               本机实测 HeapprofdConfig 没有 target_cmdline 字段）
#
# ⚠️ 本文件必须纯 ASCII、一行一个字段 —— 设备端 pbtxt 解析器吃不了
#    UTF-8 注释与紧凑嵌套（实测坑，见 record-heapprofd.sh 头部）。

buffers: {
    size_kb: 262144
    fill_policy: RING_BUFFER
}

data_sources: {
    config {
        name: "linux.ftrace"
        target_buffer: 0
        ftrace_config {
            atrace_categories: "view"
            atrace_categories: "gfx"
            atrace_categories: "input"
            atrace_categories: "wm"
            atrace_categories: "am"
            atrace_categories: "dalvik"
            atrace_apps: "__APP__"

            ftrace_events: "sched/sched_switch"
            ftrace_events: "sched/sched_waking"
            ftrace_events: "sched/sched_blocked_reason"
            ftrace_events: "power/cpu_frequency"
            ftrace_events: "power/cpu_idle"
            ftrace_events: "task/task_rename"
            ftrace_events: "task/task_newtask"
            ftrace_events: "binder/binder_transaction"
            ftrace_events: "binder/binder_transaction_received"
        }
    }
}

data_sources: {
    config {
        name: "linux.process_stats"
        target_buffer: 0
        process_stats_config {
            scan_all_processes_on_start: true
            proc_stats_poll_ms: 1000
        }
    }
}

data_sources: {
    config {
        name: "android.heapprofd"
        target_buffer: 0
        heapprofd_config {
            pid: __PID__
            sampling_interval_bytes: 4096
            shmem_size_bytes: 16777216
            block_client: true
            continuous_dump_config {
                dump_interval_ms: 3000
            }
        }
    }
}

data_sources: {
    config {
        name: "android.surfaceflinger.frametimeline"
    }
}
